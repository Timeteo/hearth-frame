<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hearth-frame</title>
<style>
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0a0b0e; font-family:Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; cursor:none; }

  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease; }
  .slide.on { opacity:1; }
  .slide img { position:absolute; top:0; height:100%; object-fit:cover; background:#0a0b0e; }
  .slide.full img { left:0; width:100%; }
  .slide.pair img.l { left:0; width:calc(50% - 1px); }
  .slide.pair img.r { left:calc(50% + 1px); width:calc(50% - 1px); }
  /* lone portrait fallback: centered, dark gutters */
  .slide.solo img { left:50%; transform:translateX(-50%); width:auto; max-width:100%; }

  .scrim-b { position:absolute; left:0; right:0; bottom:0; height:28vh; pointer-events:none;
    background:linear-gradient(180deg, rgba(10,11,14,0) 0%, rgba(10,11,14,.55) 70%, rgba(10,11,14,.72) 100%); }
  .scrim-t { position:absolute; left:0; right:0; top:0; height:14vh; pointer-events:none;
    background:linear-gradient(0deg, rgba(10,11,14,0) 0%, rgba(10,11,14,.45) 100%); }

  #clock { position:absolute; left:48px; bottom:40px; color:rgba(255,255,255,.97);
    text-shadow:0 1px 12px rgba(0,0,0,.45); }
  #clock .t { font-size:88px; font-weight:300; line-height:1; letter-spacing:-1px; }
  #clock .t .ap { font-size:26px; font-weight:500; color:#FFB27A; margin-left:8px; letter-spacing:.06em; }
  #clock .w { margin-top:10px; font-size:21px; font-weight:400; color:rgba(255,255,255,.85); min-height:25px; }
  #clock .w .deg { font-weight:500; }
  #clock .w .dot { color:#FFB27A; margin:0 8px; }
  #clock .w .hl { color:rgba(255,255,255,.55); }

  .meta { position:absolute; bottom:46px; text-align:right; color:rgba(255,255,255,.85);
    text-shadow:0 1px 10px rgba(0,0,0,.5); display:none; }
  .meta .loc { font-size:20px; font-weight:400; }
  .meta .loc .pin { color:#FFB27A; margin-right:6px; font-size:17px; }
  .meta .date { margin-top:6px; font-size:15px; font-weight:400; letter-spacing:.05em;
    color:rgba(255,255,255,.55); }
  .meta .date .ago { color:#FFB27A; }
  #metaR { right:48px; }
  #metaL { right:calc(50% + 25px); }
  #metaL .loc, #metaL .date { font-size:18px; }
  #metaL .date { font-size:14px; }
  .meta.pairhalf .loc { font-size:18px; }
  .meta.pairhalf .date { font-size:14px; }

  /* ---------- approach controls ----------
     Walking up (kitchen mmWave zone 1) fades these in over the photo. The photo
     itself never changes on approach - only what you can do with it. See
     portal-active-decisions.md A.10. */
  #ctl { position:absolute; inset:0; opacity:0; transition:opacity .45s ease;
    pointer-events:none; }
  #ctl.on { opacity:1; pointer-events:auto; }
  .navz { position:absolute; top:0; bottom:0; width:22%; }
  .navz.l { left:0; } .navz.r { right:0; }
  .chev { position:absolute; top:50%; transform:translateY(-50%);
    width:74px; height:74px; border-radius:50%;
    background:rgba(14,16,20,.46); border:1px solid rgba(255,255,255,.16);
    color:rgba(255,255,255,.92); font-size:34px; line-height:72px; text-align:center; }
  .navz.l .chev { left:34px; } .navz.r .chev { right:34px; }
  .chev.off { opacity:.22; }
  #bar { position:absolute; left:50%; transform:translateX(-50%); bottom:38px;
    display:flex; align-items:center; gap:8px;
    background:rgba(14,16,20,.52); border:1px solid rgba(255,255,255,.14);
    border-radius:26px; padding:9px 13px; }
  #bar button { -webkit-appearance:none; appearance:none; border:0; background:transparent;
    color:rgba(255,255,255,.93); font-family:inherit; font-size:16px; font-weight:500;
    letter-spacing:.02em; padding:7px 15px; border-radius:19px; }
  #bar button.prim { background:rgba(255,178,122,.94); color:#20150c; font-weight:600; }
  #bar button.prim.err { background:rgba(214,84,72,.94); color:#fff; }
  #bar .sep { width:1px; height:22px; background:rgba(255,255,255,.18); }
  #pos { font-size:13px; color:rgba(255,255,255,.5); padding:0 6px; letter-spacing:.06em; }
</style>
</head>
<body>
  <div id="sA" class="slide"></div>
  <div id="sB" class="slide"></div>
  <div class="scrim-t"></div>
  <div class="scrim-b"></div>
  <div id="clock">
    <div class="t"><span id="tt"></span><span class="ap" id="ap"></span></div>
    <div class="w" id="wline"></div>
  </div>
  <div class="meta" id="metaL"></div>
  <div class="meta" id="metaR"></div>
  <div id="ctl">
    <div class="navz l" id="zl"><div class="chev" id="cl">‹</div></div>
    <div class="navz r" id="zr"><div class="chev" id="cr">›</div></div>
    <div id="bar">
      <button id="bPrev">Back</button>
      <span id="pos"></span>
      <button id="bNext">Next</button>
      <span class="sep"></span>
      <button id="bDash" class="prim">Dashboard</button>
    </div>
  </div>

<script>
(() => {
  const CFG = {
    manifest: "frame/manifest.json",
    // Published by the "Portal Frame - Publish Weather" HA automation;
    // the frame server proxies it same-origin at frame/weather.json.
    // No tokens: only non-sensitive weather data is fetched.
    weather_json: "frame/weather.json",
    // Same file also carries `near` (kitchen mmWave zone 1 occupied, 0/1), so the
    // approach controls need no second endpoint. Polled fast; the file is tiny.
    presence_poll_ms: 1500,
    presence_stale_s: 120,     // no fresh publish for this long => assume nobody there
    controls_linger_ms: 12000, // keep controls up this long after the last touch
    history_max: 40,           // slides you can walk back through
    // Tokenless local webhook -> automation.portal_frame_summon_dashboard_webhook
    // -> button.kitchen_screen_go_to_dashboard. Fire-and-forget (no-cors).
    dashboard_webhook: "https://hal.frigga.win/api/webhook/portal-frame-show-dashboard",
    dwell_ms: 60000,
    fade_ms: 1400,
    weather_refresh_ms: 15 * 60 * 1000,
    manifest_refresh_ms: 30 * 60 * 1000,
    // Recent + anniversary mix. Immich manifests label bounded cache pools;
    // legacy manifests without labels still use date-derived pools.
    recent_share: 0.25,
    recent_days: 90,
    recent_min_pool: 50,
    // Anniversary photos taken within ±window days of today's calendar
    // date (any year) get anniv_share of slots. Share scales down linearly
    // when the pool is smaller than anniv_min_pool so a thin window doesn't
    // repeat the same few photos all evening.
    anniv_share: 0.3,
    anniv_window_days: 14,
    anniv_min_pool: 12,
    anniv_per_date_cap: 6,     // max photos per exact capture date per cycle
  };
  // URL overrides, e.g. ?recent=25&recentDays=90&anniv=30&window=14&dwell=10 (regex, not
  // URLSearchParams — the Portal WebView is old)
  {
    const q = k => (location.search.match(new RegExp("[?&]" + k + "=(\\d+)")) || [])[1];
    if (q("recent") != null) CFG.recent_share = +q("recent") / 100;
    if (q("recentDays")) CFG.recent_days = +q("recentDays");
    if (q("anniv") != null) CFG.anniv_share = +q("anniv") / 100;
    if (q("window")) CFG.anniv_window_days = +q("window");
    if (q("dwell")) CFG.dwell_ms = +q("dwell") * 1000;
  }

  const $ = id => document.getElementById(id);

  // The Portal's old Android build can lose network time on an isolated VLAN.
  // Anchor display/calendar logic to nginx's HTTP Date header while retaining
  // the device's correct timezone for local formatting.
  let serverOffsetMs = 0;
  const now = () => new Date(Date.now() + serverOffsetMs);

  /* ---------- clock ---------- */
  function tick() {
    const d = now();
    let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM";
    $("tt").textContent = (h % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0");
    $("ap").textContent = ap;
  }
  setInterval(tick, 1000); tick();

  /* ---------- weather ---------- */
  const COND = {
    "clear-night": "Clear", cloudy: "Cloudy", fog: "Fog", hail: "Hail",
    lightning: "Storm", "lightning-rainy": "Thunderstorms", partlycloudy: "Partly Cloudy",
    pouring: "Pouring", rainy: "Rain", snowy: "Snow", "snowy-rainy": "Wintry Mix",
    sunny: "Sunny", windy: "Windy", "windy-variant": "Windy", exceptional: "Alert",
  };
  // The feed carries both weather and presence. Weather tolerates 2h of staleness;
  // presence must not - a stale `near:1` would pin the controls up forever.
  let nearNow = false;
  function refreshFeed() {
    const el = $("wline");
    fetch(CFG.weather_json + "?t=" + Date.now())
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(w => {
        const age = ((Date.now() + serverOffsetMs) / 1000) - (w.ts || 0);
        setNear(w.near === 1 && age <= CFG.presence_stale_s);
        if (age > 2 * 3600) throw new Error("stale");
        const cond = COND[w.cond] || w.cond;
        const hl = (w.hi != null && w.lo != null)
          ? `<span class="dot">·</span><span class="hl">H ${w.hi}° · L ${w.lo}°</span>` : "";
        el.innerHTML = `<span class="deg">${w.t}°</span> ${cond}${hl}`;
      })
      .catch(() => { el.innerHTML = ""; setNear(false); });
  }
  setInterval(refreshFeed, CFG.presence_poll_ms); refreshFeed();

  /* ---------- photo deck ---------- */
  let deck = [];        // shuffled photo entries not yet shown
  let recentDeck = [];  // shuffled recently captured entries
  let annivDeck = [];   // shuffled "taken around this date, past years" entries
  let annivDay = "";    // date the anniversary pool was built for
  let all = [];         // full manifest
  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function loadManifest() {
    return fetch(CFG.manifest + "?t=" + Date.now())
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        const serverTime = Date.parse(r.headers.get("Date") || "");
        if (Number.isFinite(serverTime)) serverOffsetMs = serverTime - Date.now();
        return r.json();
      })
      .then(m => { all = m.photos || m; deck = []; recentDeck = []; annivDay = ""; })
      .catch(() => {});
  }
  setInterval(loadManifest, CFG.manifest_refresh_ms);

  const isPortrait = p => (p.h || 0) > (p.w || 0);

  /* ---------- anniversary pool ---------- */
  // date-only strings must not go through Date() — it parses them as UTC
  const parseD = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m && { y: +m[1], mo: +m[2], da: +m[3] }; };
  function annivDelta(p, now) {        // min |days| between photo's calendar date and today, wrapping year-end
    const d = parseD(p.d);
    if (!d) return null;
    let best = Infinity;
    for (let y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++)
      best = Math.min(best, Math.abs((new Date(y, d.mo - 1, d.da) - now) / 86400000));
    return best;
  }
  function yearsAgo(p, now) {
    const d = parseD(p.d);
    if (!d) return 0;
    // nearest anniversary's year decides the count (Dec photos shown in early Jan count the extra year)
    return Math.round((now - new Date(d.y, d.mo - 1, d.da)) / (365.25 * 86400000));
  }
  function buildAnnivPool() {
    const today = now(); today.setHours(0, 0, 0, 0);
    annivDay = today.toDateString();
    const byDate = {};
    for (const p of all) {
      const dt = annivDelta(p, today);
      if (dt == null || dt > CFG.anniv_window_days) continue;
      if (yearsAgo(p, today) < 1) continue;          // this year's photos aren't anniversaries
      (byDate[p.d] = byDate[p.d] || []).push(p);
    }
    const pool = [];
    for (const k in byDate) {                       // clump control: cap per capture date
      const g = shuffle(byDate[k]);
      pool.push(...g.slice(0, CFG.anniv_per_date_cap));
    }
    annivDeck = shuffle(pool);
    annivPoolSize = pool.length;
    return pool.length;
  }
  let annivPoolSize = 0;
  function annivShareNow() {                        // rebuilds pool on day change / manifest refresh
    if (now().toDateString() !== annivDay) buildAnnivPool();
    if (!annivPoolSize) return 0;                   // nothing near this date — pure uniform mode
    if (!annivDeck.length) buildAnnivPool();        // cycled through: reshuffle for the rest of the day
    return CFG.anniv_share * Math.min(1, annivDeck.length / CFG.anniv_min_pool);
  }
  function takeAnniv(wantPortrait) {                // draw from anniv deck, keep main deck consistent
    const i = wantPortrait == null ? 0 : annivDeck.findIndex(p => isPortrait(p) === wantPortrait);
    if (i < 0) return null;
    const p = annivDeck.splice(i, 1)[0];
    const j = deck.indexOf(p);
    if (j >= 0) deck.splice(j, 1);
    return p;
  }

  function recentDelta(p, now) {
    const d = parseD(p.d);
    return d ? Math.floor((now - new Date(d.y, d.mo - 1, d.da)) / 86400000) : null;
  }
  function buildRecentPool() {
    const today = now(); today.setHours(0, 0, 0, 0);
    const pool = all.filter(p => {
      const days = recentDelta(p, today);
      return days != null && days >= 0 && days <= CFG.recent_days && (!p.pool || p.pool === "recent");
    });
    recentDeck = shuffle(pool);
    return pool.length;
  }
  function recentShareNow() {
    if (!recentDeck.length && !buildRecentPool()) return 0;
    return CFG.recent_share * Math.min(1, recentDeck.length / CFG.recent_min_pool);
  }
  function takeRecent(wantPortrait) {
    const i = wantPortrait == null ? 0 : recentDeck.findIndex(p => isPortrait(p) === wantPortrait);
    if (i < 0) return null;
    return recentDeck.splice(i, 1)[0];
  }

  function takeBase(wantPortrait) {
    if (!deck.length) deck = shuffle(all.filter(p => !p.pool || p.pool === "random"));
    const i = wantPortrait == null ? 0 : deck.findIndex(p => isPortrait(p) === wantPortrait);
    return i < 0 ? null : deck.splice(i, 1)[0];
  }

  function draw() {                    // next 1-2 photos forming one slide
    if (!all.length) return null;
    const recentShare = recentShareNow(), annivShare = annivShareNow();
    const roll = Math.random();
    const source = roll < recentShare ? "recent" : roll < recentShare + annivShare ? "anniv" : "random";
    const take = source === "recent" ? takeRecent : source === "anniv" ? takeAnniv : takeBase;
    const first = take(null) || takeBase(null) || takeRecent(null) || takeAnniv(null);
    if (!first) return null;
    if (!isPortrait(first)) return { kind: "full", ph: [first] };
    // Pair portraits from the same content pool when possible.
    const partner = take(true) || takeBase(true) || takeRecent(true) || takeAnniv(true);
    if (partner) return { kind: "pair", ph: [first, partner] };
    return { kind: "solo", ph: [first] };
  }

  const MON = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY",
    "AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
  function fmtDate(iso) {
    // date-only strings must not go through Date() — it parses them as UTC
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    if (!m) return "";
    return `${MON[+m[2] - 1]} ${+m[3]}, ${m[1]}`;
  }
  function metaHtml(p) {
    const loc = p.loc ? `<div class="loc"><span class="pin">◆</span>${esc(p.loc)}</div>` : "";
    let date = fmtDate(p.d);
    if (date) {
      const today = now(); today.setHours(0, 0, 0, 0);
      const dt = annivDelta(p, today), yrs = yearsAgo(p, today);
      if (dt != null && dt <= CFG.anniv_window_days && yrs >= 1)
        date += ` <span class="ago">· ${yrs} ${yrs === 1 ? "YEAR" : "YEARS"} AGO</span>`;
    }
    return loc || date ? `${loc}<div class="date">${date}</div>` : "";
  }
  const src = p => p.f.match(/^https?:/) ? p.f : "frame/" + p.f;

  function preload(urls) {
    return Promise.all(urls.map(u => new Promise(res => {
      const im = new Image();
      im.onload = () => res(true); im.onerror = () => res(false);
      im.src = u;
    })));
  }

  /* ---------- slide history ----------
     Every rendered slide is kept so "Back" can reach a photo you caught a glimpse
     of just before a transition. `pos` is where we are inside history; stepping
     forward off the end draws a new slide. */
  let front = $("sA"), back = $("sB");
  let history = [];
  let pos = -1;
  let timer = null;

  function render(s) {
    const urls = s.ph.map(src);
    return preload(urls).then(ok => {
      if (ok.some(x => !x)) return false;             // broken files: caller retries
      back.className = "slide " + s.kind;
      back.innerHTML = s.kind === "pair"
        ? `<img class="l" src="${esc(urls[0])}"><img class="r" src="${esc(urls[1])}">`
        : `<img src="${esc(urls[0])}">`;
      back.classList.add("on"); front.classList.remove("on");
      [front, back] = [back, front];
      const mL = $("metaL"), mR = $("metaR");
      if (s.kind === "pair") {
        mL.innerHTML = metaHtml(s.ph[0]); mL.className = "meta pairhalf";
        mR.innerHTML = metaHtml(s.ph[1]); mR.className = "meta pairhalf";
        mL.style.display = mL.innerHTML ? "block" : "none";
        mR.style.display = mR.innerHTML ? "block" : "none";
      } else {
        mL.style.display = "none";
        mR.innerHTML = metaHtml(s.ph[0]); mR.className = "meta";
        mR.style.display = mR.innerHTML ? "block" : "none";
      }
      return true;
    });
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(() => step(1, true), CFG.dwell_ms);
  }

  // dir: +1 forward, -1 back. auto: this was the dwell timer, not a person.
  function step(dir, auto) {
    if (dir < 0) {
      if (pos <= 0) { paint(); return; }
      pos--;
      render(history[pos]).then(paint);
      if (!auto) schedule();
      return;
    }
    if (pos < history.length - 1) {                    // replay forward through history
      pos++;
      render(history[pos]).then(paint);
      schedule();                                      // always re-arm: an auto replay that skipped this froze the frame
      return;
    }
    const s = draw();
    if (!s) { clearTimeout(timer); timer = setTimeout(() => step(1, true), 30000); loadManifest(); return; }
    render(s).then(ok => {
      if (!ok) { step(1, auto); return; }              // skip broken, draw another
      history.push(s);
      if (history.length > CFG.history_max) history.shift();
      pos = history.length - 1;
      paint();
    });
    schedule();
  }

  /* ---------- approach controls ---------- */
  const ctl = $("ctl");
  let touchedAt = 0;

  function paint() {                                   // refresh control affordances
    $("cl").className = "chev" + (pos > 0 ? "" : " off");
    $("pos").textContent = pos > 0 ? (pos + 1) + " / " + history.length : "";
  }

  // ?ctl=1 pins the controls up: lets the controls be inspected on-device without
  // standing in the kitchen. Not used in normal operation.
  const forceCtl = /[?&]ctl=1/.test(location.search);
  function controlsShouldShow() {
    return forceCtl || nearNow || (Date.now() - touchedAt) < CFG.controls_linger_ms;
  }
  function syncControls() {
    ctl.classList.toggle("on", controlsShouldShow());
  }
  // The webhook goes out over TLS to the reverse proxy, and this WebView is slow to
  // set that up cold - which is the whole delay when you tap Dashboard. Warm the
  // connection the moment someone walks up, so the tap reuses it.
  let warmedAt = 0;
  function warmDashboardLink() {
    if (Date.now() - warmedAt < 60000) return;
    warmedAt = Date.now();
    fetch(CFG.dashboard_webhook, { method: "HEAD", mode: "no-cors" }).catch(() => {});
  }

  function setNear(v) {
    if (v === nearNow) return;
    nearNow = v;
    if (v) warmDashboardLink();
    syncControls();
  }
  setInterval(syncControls, 1000);

  function touched() { touchedAt = Date.now(); syncControls(); }

  function bind(id, fn) {
    const el = $(id);
    // Both events: the old WebView fires touchend reliably, click sometimes lags.
    el.addEventListener("touchend", e => { e.preventDefault(); e.stopPropagation(); touched(); fn(); }, false);
    el.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); touched(); fn(); }, false);
  }
  bind("bPrev", () => step(-1, false));
  bind("bNext", () => step(1, false));
  bind("zl", () => step(-1, false));
  bind("zr", () => step(1, false));
  bind("bDash", showDashboard);

  let dashResetTimer = 0;
  function showDashboard() {
    // Acknowledge the tap immediately - the round trip is not instant and a button
    // that looks dead gets pressed twice.
    const b = $("bDash");
    const label = (text, ms) => {
      b.textContent = text;
      clearTimeout(dashResetTimer);
      dashResetTimer = setTimeout(() => {
        b.textContent = "Dashboard";
        b.classList.remove("err");
      }, ms);
    };
    b.classList.remove("err");
    label("Opening…", 4000);
    // no-cors: HA's webhook sends no CORS headers and we do not need the reply.
    // An opaque response still means the request arrived; a network failure
    // (firewall rule, DNS, proxy down) rejects. A firewall that silently drops
    // packets never answers at all, so the abort timer turns a hang into an error.
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 8000);
    fetch(CFG.dashboard_webhook, { method: "POST", mode: "no-cors", body: "{}", signal: ac.signal })
      .then(() => clearTimeout(t))
      .catch((e) => {
        clearTimeout(t);
        console.warn("[hearth-frame] dashboard webhook failed:", e && e.name, e && e.message);
        b.classList.add("err");
        label("Can't reach Home Assistant", 6000);
      });
  }

  // Swipe anywhere: right-to-left = next, left-to-right = back.
  let sx = 0, sy = 0, st = 0;
  document.addEventListener("touchstart", e => {
    const t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now();
    touched();
  }, false);
  document.addEventListener("touchend", e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st > 700) return;                 // slow drag is not a swipe
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    step(dx < 0 ? 1 : -1, false);
  }, false);

  loadManifest().then(() => { step(1, true); });
})();
</script>
